name: iOS CI

# يبني ويختبر محرك الوزن (Swift Package) وتطبيق SwiftUI معًا على كل push وكل Pull Request للفرع الرئيسي.
# أي خطأ compile أو اختبار فاشل يوقف الـ job فورًا (سلوك GitHub Actions الافتراضي: أي خطوة تُرجع كودًا
# غير صفري تُفشل الـ job وتوقف تنفيذ الخطوات التالية، بلا أي `continue-on-error` هنا).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      # --- محرك الوزن: Swift Package مستقل، يُبنى ويُختبر بمعزل تام عن Xcode/iOS ---
      - name: swift build (PoetryEngine)
        working-directory: ios/PoetryEngine
        run: swift build

      - name: swift test (PoetryEngine)
        working-directory: ios/PoetryEngine
        run: swift test --parallel

      # --- تطبيق iOS: يحتاج توليد .xcodeproj عبر XcodeGen أولًا (غير مرفوع لـ Git عمدًا) ---
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/PoetryMeterApp
        run: xcodegen generate

      - name: Resolve an available iOS Simulator
        id: simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "
import json, sys
data = json.load(sys.stdin)
for runtime, devices in data['devices'].items():
    if 'iOS' not in runtime:
        continue
    for d in devices:
        if d['name'].startswith('iPhone'):
            print(d['udid'])
            sys.exit(0)
sys.exit(1)
")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "سيُستخدم المحاكي: $UDID"

      - name: xcodebuild build-for-testing
        working-directory: ios/PoetryMeterApp
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project PoetryMeterApp.xcodeproj \
            -scheme PoetryMeterApp \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}"

      - name: xcodebuild test-without-building
        working-directory: ios/PoetryMeterApp
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project PoetryMeterApp.xcodeproj \
            -scheme PoetryMeterApp \
            -destination "id=${{ steps.simulator.outputs.udid }}"

      # --- نسخة تفاعلية للتجربة عبر المتصفح (Appetize.io) — راجع ios/CI_CD.md لإعداد الحساب والمفتاح ---
      # لا يوجد `if:` هنا عمدًا: هذه الخطوة تُنفَّذ فقط إذا نجحت كل الخطوات السابقة (بناء واختبار) —
      # لا معنى لرفع نسخة تفاعلية من كود لم يجتز الاختبارات بعد.
      - name: Build .app for Simulator (Appetize)
        working-directory: ios/PoetryMeterApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project PoetryMeterApp.xcodeproj \
            -scheme PoetryMeterApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build

          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "*.app" -print -quit)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" PoetryMeterApp.zip

      - name: Upload build to Appetize.io
        if: ${{ env.APP_PATH != '' }}
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        working-directory: ios/PoetryMeterApp
        run: |
          set -euo pipefail
          if [ -z "${APPETIZE_API_TOKEN:-}" ]; then
            echo "⚠️ لم يُضبط السر APPETIZE_API_TOKEN — تخطّي الرفع لـ Appetize (اختياري). راجع ios/CI_CD.md."
            exit 0
          fi

          RESPONSE=$(curl -sS -X POST https://api.appetize.io/v1/apps \
            -u "${APPETIZE_API_TOKEN}:" \
            -F "file=@PoetryMeterApp.zip" \
            -F "platform=ios" \
            -F "note=CI build from ${{ github.sha }}")

          echo "$RESPONSE"
          PUBLIC_URL=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('publicURL','-'))")

          {
            echo "### 📱 نسخة تفاعلية على Appetize.io"
            echo ""
            echo "افتح هذا الرابط من أي متصفح (بما فيها التابلت) لتجربة التطبيق مباشرة:"
            echo ""
            echo "**${PUBLIC_URL}**"
          } >> "$GITHUB_STEP_SUMMARY"
