name: iOS Deploy to TestFlight

# يعمل فقط عند نشر Release جديد على GitHub (وهو ما يتطلب Tag أصلًا) — وليس على كل push، تفاديًا لرفع
# نسخ تجريبية لـ TestFlight بشكل متكرر. للنشر يدويًا (إعادة محاولة بعد إصلاح سر خاطئ مثلًا) استخدم أيضًا
# "Run workflow" من تبويب Actions (workflow_dispatch أدناه).
#
# **قبل أول تشغيل: راجع ios/CI_CD.md بالكامل — يشرح كل GitHub Secret/Variable مطلوب هنا وكيف تحصل عليه
# من Apple Developer وApp Store Connect، بلا حاجة لأي جهاز Mac فعلي.**

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-testflight
  cancel-in-progress: false

jobs:
  test:
    name: Test before releasing
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: swift test (PoetryEngine)
        working-directory: ios/PoetryEngine
        run: swift test --parallel

  deploy:
    name: Archive, sign & upload to TestFlight
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP_BUNDLE_IDENTIFIER: ${{ vars.APP_BUNDLE_IDENTIFIER }}
      TEAM_ID: ${{ vars.TEAM_ID }}
      PROVISIONING_PROFILE_NAME: ${{ vars.PROVISIONING_PROFILE_NAME }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Verify required secrets and variables are set
        run: |
          set -euo pipefail
          missing=0
          for name in APP_BUNDLE_IDENTIFIER TEAM_ID PROVISIONING_PROFILE_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "❌ Repository Variable مفقود: $name — راجع ios/CI_CD.md"
              missing=1
            fi
          done
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "❌ Secret مفقود: $name — راجع ios/CI_CD.md"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/PoetryMeterApp
        run: xcodegen generate

      - name: Install fastlane
        run: gem install fastlane --no-document

      # --- استيراد شهادة التوقيع وملف الـ Provisioning Profile إلى Keychain مؤقت خاص بهذا الـ run فقط ---
      - name: Import signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          # Keychain مؤقت جديد كليًا لهذا الـ run، بدل التأثير على أي Keychain آخر على الـ runner.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Decode App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 --decode -o "$KEY_PATH"
          echo "APP_STORE_CONNECT_API_KEY_FILEPATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: fastlane beta (build + upload to TestFlight)
        working-directory: ios/PoetryMeterApp
        run: fastlane beta

      # --- تنظيف: يعمل دائمًا حتى لو فشلت خطوة سابقة، لعدم ترك الشهادة/الـ Keychain على الـ runner ---
      - name: Clean up temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
