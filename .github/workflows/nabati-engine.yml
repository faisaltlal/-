name: محرك العروض النبطي

# يعمل على دفع أي شيء تحت nabati/ وعلى الطلب اليدوي.
# التشغيل اليدوي مقصود: التطوير يجري من تابلت، والزرّ في صفحة Actions
# هو أسهل طريقة لتشغيل الاختبارات من الهاتف.
on:
  push:
    paths: ['nabati/**', '.github/workflows/nabati-engine.yml']
  pull_request:
    paths: ['nabati/**', '.github/workflows/nabati-engine.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    name: جافاسكربت — المحرك المرجعي
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # البيانات في data/*.json هي المصدر الوحيد، ولها نسختان مولَّدتان
      # (وحدة جافاسكربت للمتصفح، وموارد حزمة Swift). هذا الفحص يمنع
      # انحرافهما عن المصدر بصمت.
      - name: تطابق البيانات المولَّدة مع المصدر
        working-directory: nabati
        run: node tools/bundle-data.js --check

      # الملف الواحد يحزم نفس ملفات المحرك، فلا يجوز أن ينحرف عنها.
      - name: الملف الواحد محدَّث
        working-directory: nabati
        run: node tools/build-standalone.js --check

      - name: الاختبارات
        working-directory: nabati
        run: node tests/run.js

      - name: التحقّق من صحة كل ملفات JSON
        run: |
          for f in nabati/data/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              || { echo "✗ JSON غير صالح: $f"; exit 1; }
            echo "✓ $f"
          done

  swift:
    name: Swift — حزمة المحرك
    runs-on: ubuntu-latest
    # صورة 5.9 أسقطت الاختبارات كلها داخل Foundation قبل أول تأكيد
    # («Constant strings cannot be deallocated»)، والبناء ينجح فيها.
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4

      - name: البناء
        working-directory: nabati/swift
        run: swift build

      # الانهيار داخل Foundation يبتلع مخرجات XCTest، فنحفظها ونعرض
      # السطور الدالّة عند الفشل بدل أن نقرأ تفريغ المسجّلات.
      # صورة swift تشغّل sh (dash) افتراضيًا، ولا pipefail فيها.
      - name: الاختبارات
        working-directory: nabati/swift
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee test-output.txt || {
            echo "───────── السطور الدالّة ─────────"
            grep -nE "Test Case|Fatal error|error:|XCTAssert|failed" test-output.txt | tail -40
            exit 1
          }

  parity:
    name: تطابق التنفيذين
    runs-on: ubuntu-latest
    needs: [javascript, swift]
    steps:
      - uses: actions/checkout@v4
      - name: تذكير
        run: |
          echo "التنفيذان يقرآن golden_cases.json نفسه."
          echo "نجاح المهمّتين أعلاه يعني توافقهما على كل حالة مرجعية."
