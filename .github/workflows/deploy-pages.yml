name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Requires Pages to be switched on once, by hand:
      #   Settings → Pages → Build and deployment → Source: GitHub Actions
      # The `enablement` input cannot do it for us — GITHUB_TOKEN is not
      # allowed to create a Pages site ("Resource not accessible by
      # integration"). Until that switch is flipped this step fails with
      # "Get Pages site failed … Not Found".
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The site is plain static files at the repo root — no build step.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
